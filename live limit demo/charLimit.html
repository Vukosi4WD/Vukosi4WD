<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Limit Demo!</title>
    <link rel="stylesheet" href="charLimit.css">
</head>
<body>
    <h1 id="error-display">Ooops, that's too much yapping gang!</h1>
    <fieldset>
        <label for="tweet">Share your thoughts:
            <textarea name="tweet" id="tweet"></textarea> 
            <div id="displayArea"></div>
            <p id="charCount">counter</p>
        </label>
    </fieldset>
    <button type="submit" id="submit">Submit</button>
    <p id="complete">So profound, Shakespheare has been silent since!</p>
    <script src="charLimit.js"></script>
</body>
</html>
