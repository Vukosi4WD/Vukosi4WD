<!DOCTYPE html>
<html>
    <head>
        <title>Quiz App</title>
        <link rel="stylesheet" href="./quizApp.css">
    </head>
    <body>
        <div id="questionCard" class="Quiz">
            <h1 id="question">Question?</h1>
            <div id="answers">
                <ul>
                    <li>
                    <input type="radio" id="a" class="answer" name="answer">
                    <label for="a" id="a_text">Option 1</label>
                </li>
                    <li>
                        <input type="radio" id="b" class="answer" name="answer">
                        <label for="b" id="b_text">Option 2</label>
                    </li>
                    <li>
                        <input type="radio" id="c" class="answer" name="answer">
                        <label for="c" id="c_text">Option 3</label>
                    </li>
                    <li>
                        <input type="radio" id="d" class="answer" name="answer">
                        <label for="d" id="d_text">Option 4</label>
                    </li>
                </ul>
                  <button id="submitBtn">Submit</button>
            </div>
        </div>
        <script src="./quizApp.js"></script>
    </body>
</html>
