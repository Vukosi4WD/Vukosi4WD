<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mask Email</title>
    <link rel="stylesheet" href="maskEmail2.css">
</head>
<body>

    <div class="container">

        <h1>Email Masking Demo</h1>

        <div class="example-box">
            <h2>Example</h2>
            <p>Your email will be masked like this:</p>
            <div id="email-display" class="masked-output"></div>
        </div>

        <div class="input-box">
            <label for="email">Enter your email:</label>
            <input type="email" id="email" placeholder="e.g. johndoe@example.com">
            <button id="submit">Mask Email</button>
        </div>

        <div class="result-box">
            <h2>Your Masked Email:</h2>
            <div id="user-email-display" class="masked-output"></div>
        </div>

    </div>

    <script src="maskEmail2.js"></script>
</body>
</html>
